<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Booking Page</title>
<!-- Preload and link Google Fonts: Inter (main text) and Playfair Display (headings) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@300&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS via CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Swap Design System -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mint-accent': '#a3fda7',
            'outline-gray': '#cccccc',
            'canvas-white': '#ffffff',
            'text-dark': '#111827',
            'text-muted': '#4b5563'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'], // mainFont
            serif: ['Playfair Display', 'serif'], // secondaryFont
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas-white text-text-dark font-sans min-h-screen py-10 px-4 sm:px-8">
<!-- BEGIN: PageHeader -->
<header class="max-w-[1060px] mx-auto mb-8">
<h1 class="font-serif text-[2.5rem] font-light leading-tight">Share your booking page</h1>
</header>
<!-- END: PageHeader -->
<!-- BEGIN: MainBookingArea -->
<main class="max-w-[1060px] mx-auto bg-canvas-white border border-outline-gray rounded-lg shadow-sm flex flex-col md:flex-row overflow-hidden min-h-[600px]">
<!-- BEGIN: LeftColumnDetails -->
<!-- Left Sidebar: Meeting details and profile info -->
<section class="w-full md:w-[320px] p-8 border-b md:border-b-0 md:border-r border-outline-gray shrink-0">
<!-- Company Branding -->
<div class="flex items-center gap-3 mb-10">
<div class="w-8 h-8 bg-blue-500 rounded skew-x-[-10deg] shrink-0"></div> <!-- Placeholder for ACME logo -->
<span class="font-semibold text-lg tracking-tight text-slate-700">ACME Inc.</span>
</div>
<!-- User Profile & Meeting Title -->
<div class="mb-8">
<img alt="Fatima Sy Profile" class="w-14 h-14 rounded-full mb-3 object-cover shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHsnLQY9XMbIsY-n9Oypmalx-R5R-57-ONFiOFcNUwWgDA6fKh7vQLBu4ek81QhWfpXdlCOK6vSSsaCsgqEqg5MpKKp7odT04jLnb-6_D3F9zfqkRJ9u-I7A_aSK2l-oPplXsG_rXE0IwzPWAkRojLSScD-Ocu3WPnXDNib_joqptoPVtyjF3H_sjPYKTXz5XEFujoSeCTaXQZDN0HyhKwhJqrtO0t8UJw5AbkSMSXikgZBomMA8ueHjvMqToXC4AjXV0-zof6IDU"/>
<p class="text-sm text-text-muted font-medium mb-1">Fatima Sy</p>
<h2 class="text-[1.75rem] font-bold leading-tight mb-6">Client Check-in</h2>
<!-- Meeting Metadata -->
<div class="space-y-4 text-[0.95rem] text-text-muted font-medium">
<div class="flex items-center gap-3">
<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<span>30 min</span>
</div>
<div class="flex items-center gap-3">
<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect height="14" rx="2" ry="2" width="15" x="1" y="5"></rect></svg>
<span>Zoom</span>
</div>
</div>
</div>
<!-- Description Placeholders -->
<div class="space-y-3 mt-10 opacity-40">
<div class="h-2.5 bg-slate-200 rounded-full w-full"></div>
<div class="h-2.5 bg-slate-200 rounded-full w-5/6"></div>
<div class="h-2.5 bg-slate-200 rounded-full w-4/6"></div>
<div class="h-2.5 bg-slate-200 rounded-full w-1/3"></div>
</div>
</section>
<!-- END: LeftColumnDetails -->
<!-- BEGIN: CenterColumnDatePicker -->
<!-- Center Column: Month-view date picker -->
<section class="flex-1 p-8 md:px-10 md:py-8 border-b md:border-b-0 md:border-r border-outline-gray flex flex-col">
<h3 class="font-bold text-lg mb-8 text-slate-800">Select a Date &amp; Time</h3>
<div class="max-w-[340px] mx-auto w-full">
<!-- Calendar Header (Month Navigation) -->
<div class="flex justify-center items-center gap-4 mb-8">
<button aria-label="Previous month" class="p-2 hover:bg-slate-50 rounded-full text-slate-400 hover:text-slate-600 transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<span class="font-medium text-[0.95rem] w-24 text-center">July 2024</span>
<button aria-label="Next month" class="p-2 bg-slate-50 text-slate-600 rounded-full hover:bg-slate-100 transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
</div>
<!-- Days of Week -->
<div class="grid grid-cols-7 gap-1 text-center text-[0.7rem] font-bold text-text-muted mb-4 tracking-wider">
<div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-y-2 text-center text-sm font-medium">
<!-- Previous Month Dates -->
<div class="py-2.5 text-slate-300">30</div>
<!-- Current Month Dates -->
<div class="py-2.5">1</div>
<div class="py-2.5">2</div>
<div class="py-2.5">3</div>
<div class="py-2.5">4</div>
<div class="py-2.5">5</div>
<div class="py-2.5">6</div>
<div class="py-2.5">7</div>
<div class="py-2.5">8</div>
<div class="py-2.5">9</div>
<div class="py-2.5">10</div>
<div class="py-2.5">11</div>
<div class="py-2.5">12</div>
<div class="py-2.5">13</div>
<div class="py-2.5">14</div>
<div class="py-2.5">15</div>
<!-- Highlighted Available Dates (Mint background theme) -->
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">16</button>
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">17</button>
<div class="py-2.5">18</div>
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">19</button>
<div class="py-2.5">20</div>
<div class="py-2.5">21</div>
<!-- Selected Date (Solid Mint theme) -->
<button class="py-2.5 bg-mint-accent text-slate-900 font-bold rounded-full shadow-sm">22</button>
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">23</button>
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">24</button>
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">25</button>
<div class="py-2.5">26</div>
<div class="py-2.5">27</div>
<div class="py-2.5">28</div>
<div class="py-2.5">29</div>
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">30</button>
<button class="py-2.5 bg-mint-accent/20 text-slate-800 font-semibold rounded-full hover:bg-mint-accent/40 transition-colors">31</button>
<!-- Next Month Dates -->
<div class="py-2.5 text-slate-300">1</div>
<div class="py-2.5 text-slate-300">2</div>
<div class="py-2.5 text-slate-300">3</div>
</div>
</div>
<!-- Timezone Selector -->
<div class="mt-auto pt-8">
<label class="block text-[0.8rem] font-bold text-slate-800 mb-2">Time zone</label>
<button class="flex items-center gap-2 text-sm text-text-muted hover:text-slate-800 transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
<span>Eastern time - US &amp; Canada</span>
<svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="6 9 12 15 18 9"></polyline></svg>
</button>
</div>
</section>
<!-- END: CenterColumnDatePicker -->
<!-- BEGIN: RightColumnTimeSlots -->
<!-- Right Column: Time slot selection -->
<section class="w-full md:w-[320px] p-8 md:py-8 bg-slate-50/30">
<p class="mb-6 text-[0.95rem] font-medium text-slate-800">Monday, July 22</p>
<div class="space-y-3 flex flex-col">
<!-- Standard Time Button -->
<button class="w-full py-3.5 border border-outline-gray bg-white rounded text-[0.95rem] font-medium text-slate-700 hover:border-slate-400 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-200">
          10:00am
        </button>
<!-- Active/Selected Time Slot with Confirm Button -->
<div class="flex w-full gap-2 h-[52px]">
<div class="flex-1 flex items-center justify-center bg-slate-600 text-white rounded text-[0.95rem] font-medium border border-slate-600">
            11:00am
          </div>
<!-- Primary action uses Mint Accent -->
<button class="flex-1 bg-mint-accent text-slate-900 rounded text-[0.95rem] font-bold border border-mint-accent hover:brightness-95 transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-mint-accent focus:ring-offset-1">
            Confirm
          </button>
</div>
<button class="w-full py-3.5 border border-outline-gray bg-white rounded text-[0.95rem] font-medium text-slate-700 hover:border-slate-400 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-200">
          1:00pm
        </button>
<button class="w-full py-3.5 border border-outline-gray bg-white rounded text-[0.95rem] font-medium text-slate-700 hover:border-slate-400 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-200">
          2:30pm
        </button>
<button class="w-full py-3.5 border border-outline-gray bg-white rounded text-[0.95rem] font-medium text-slate-700 hover:border-slate-400 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-200">
          4:00pm
        </button>
</div>
</section>
<!-- END: RightColumnTimeSlots -->
</main>
<!-- END: MainBookingArea -->
</body></html>
