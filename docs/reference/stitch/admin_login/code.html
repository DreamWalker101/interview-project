<body class="bg-background min-h-screen flex items-center justify-center font-body text-body text-text-black p-lg">
<main class="w-full max-w-[400px]">
<div class="bg-canvas-white rounded-[24px] shadow-xl p-card-padding">
<div class="mb-section text-center">
<span class="material-symbols-outlined text-primary text-[48px] mb-md" data-icon="shield_person" style="font-variation-settings: 'FILL' 0, 'wght' 200;">shield_person</span>
<h1 class="font-heading text-heading text-text-black">Admin Login</h1>
<p class="font-subheading text-subheading text-secondary mt-xs">AigentFlow Access</p>
</div>
<form class="space-y-[16px]">
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-secondary px-md" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-muted-ash" data-icon="person" style="font-variation-settings: 'FILL' 0, 'wght' 300;">person</span>
<input class="w-full bg-transparent border border-outline-gray rounded-[100px] py-[12px] pl-[40px] pr-md font-body text-body text-text-black focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-secondary px-md" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-muted-ash" data-icon="lock" style="font-variation-settings: 'FILL' 0, 'wght' 300;">lock</span>
<input class="w-full bg-transparent border border-outline-gray rounded-[100px] py-[12px] pl-[40px] pr-md font-body text-body text-text-black focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="Enter your password" type="password"/>
</div>
</div>
<div class="pt-sm pb-md">
<p class="font-label text-label text-error text-center flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[14px]" data-icon="error" style="font-variation-settings: 'FILL' 1, 'wght' 400;">error</span>
                        Invalid username or password
                    </p>
</div>
<button class="w-full bg-mint-accent text-text-black font-subheading text-subheading rounded-[200px] py-md flex items-center justify-center gap-sm hover:opacity-90 transition-opacity" type="submit">
                    Login
                    <span class="material-symbols-outlined" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0, 'wght' 400;">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<a class="font-label text-label text-secondary hover:text-primary transition-colors bg-transparent px-md py-sm" href="#">Forgot Password?</a>
</div>
</div>
<div class="mt-section text-center">
<p class="font-caption text-caption text-muted-ash">© 2024 AigentFlow AI Services. Internal Use Only.</p>
</div>
</main>
</body></html>
