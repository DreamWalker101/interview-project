<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AigentFlow - Customer Intake</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Playfair+Display:wght@100&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f1f1f1",
                        "on-primary-fixed-variant": "#00531b",
                        "canvas-white": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary-fixed": "#002107",
                        "on-tertiary-container": "#44715a",
                        "outline-gray": "#cccccc",
                        "subtle-sage": "#9cb0a8",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "text-black": "#000000",
                        "muted-ash": "#999999",
                        "graphite-inset": "#2d3637",
                        "outline-variant": "#bfcabb",
                        "background": "#f9f9f9",
                        "inverse-primary": "#82da88",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#576061",
                        "shadow-green-bg": "#0d5b3b",
                        "surface-variant": "#e2e2e2",
                        "tertiary-container": "#c2f4d6",
                        "primary": "#0d6d29",
                        "deep-forest-bg": "#083a26",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f3f3f3",
                        "on-secondary-fixed-variant": "#3f4849",
                        "subtle-gray-card": "#838676",
                        "inverse-surface": "#303030",
                        "surface": "#f9f9f9",
                        "surface-dim": "#dadada",
                        "on-secondary": "#ffffff",
                        "tertiary": "#3a6750",
                        "tertiary-fixed-dim": "#a1d1b5",
                        "on-background": "#1b1b1b",
                        "primary-fixed": "#9df7a2",
                        "secondary-fixed": "#dbe4e5",
                        "tertiary-fixed": "#bceed0",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#bfc8c9",
                        "on-tertiary-fixed": "#002113",
                        "primary-container": "#a3fda7",
                        "surface-bright": "#f9f9f9",
                        "stone-beige": "#e9e7e2",
                        "primary-fixed-dim": "#82da88",
                        "on-primary-container": "#1d7732",
                        "on-surface-variant": "#3f493e",
                        "mint-accent": "#a3fda7",
                        "agentic-gradient": "linear-gradient(90deg, #82ff87 0%, #a3fda7 50%, #deff82 100%)",
                        "on-secondary-fixed": "#141d1e",
                        "secondary-container": "#d8e1e2",
                        "on-tertiary-fixed-variant": "#214f3a",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary-container": "#5b6465",
                        "error": "#ba1a1a",
                        "on-surface": "#1b1b1b",
                        "surface-container": "#eeeeee",
                        "surface-tint": "#0d6d29",
                        "outline": "#707a6d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "30px",
                        "gap-element": "8px",
                        "xs": "4px",
                        "md": "12px",
                        "section": "30px",
                        "card-padding": "20px",
                        "lg": "20px",
                        "3xl": "80px",
                        "2xl": "40px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "heading": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"],
                        "subheading": ["Inter", "sans-serif"],
                        "display-mobile": ["Playfair Display", "serif"],
                        "display": ["Playfair Display", "serif"],
                        "body": ["Inter", "sans-serif"],
                        "heading-lg": ["Inter", "sans-serif"],
                        "caption": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "heading": ["24px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "label": ["12px", { "lineHeight": "1.0", "fontWeight": "500" }],
                        "subheading": ["18px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "display-mobile": ["72px", { "lineHeight": "1.0", "letterSpacing": "-0.017em", "fontWeight": "100" }],
                        "display": ["120px", { "lineHeight": "0.95", "letterSpacing": "-1.22px", "fontWeight": "100" }],
                        "body": ["15px", { "lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "400" }],
                        "heading-lg": ["30px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "caption": ["9px", { "lineHeight": "1.2", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body text-text-black antialiased selection:bg-mint-accent selection:text-text-black">
<!-- Top AppBar (Navigation Shell suppressed for linear transaction flow like Intake, but header kept for brand) -->
<header class="bg-canvas-white flex justify-between items-center w-full px-xl py-md max-w-full border-b border-outline-gray">
<div class="flex items-center gap-md">
<span class="text-heading font-heading font-bold text-text-black">AigentFlow</span>
</div>
<div>
<button class="text-label font-label text-secondary hover:text-text-black flex items-center gap-xs transition-colors">
<span class="material-symbols-outlined text-[16px]">close</span>
                Exit Intake
            </button>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-xl sm:py-3xl">
<!-- Multi-step Form Container -->
<div class="w-full max-w-[600px] bg-canvas-white rounded-[24px] shadow-xl p-xl flex flex-col gap-section relative overflow-hidden">
<!-- Progress Indicator -->
<div class="flex justify-between items-center mb-md px-md">
<div class="flex items-center gap-sm">
<span class="text-label font-label text-muted-ash">Step 1 of 5</span>
</div>
<div class="flex gap-xs">
<div class="h-1 w-8 rounded-full bg-mint-accent"></div>
<div class="h-1 w-8 rounded-full bg-outline-gray/30"></div>
<div class="h-1 w-8 rounded-full bg-outline-gray/30"></div>
<div class="h-1 w-8 rounded-full bg-outline-gray/30"></div>
<div class="h-1 w-8 rounded-full bg-outline-gray/30"></div>
</div>
</div>
<!-- Step 1: Contact Info -->
<div class="flex flex-col gap-lg">
<div>
<h1 class="text-heading-lg font-heading-lg text-text-black mb-xs">Contact Information</h1>
<p class="text-body font-body text-secondary">Let's start with the basics to get you set up.</p>
</div>
<div class="flex flex-col gap-lg mt-md">
<div class="flex flex-col sm:flex-row gap-lg">
<div class="flex flex-col gap-gap-element w-full">
<label class="text-label font-label text-text-black" for="firstName">First Name</label>
<input class="w-full bg-transparent border border-outline-gray rounded-[100px] px-lg py-md text-body font-body focus:outline-none focus:border-graphite-inset focus:ring-1 focus:ring-graphite-inset transition-colors placeholder:text-muted-ash" id="firstName" placeholder="Jane" type="text"/>
</div>
<div class="flex flex-col gap-gap-element w-full">
<label class="text-label font-label text-text-black" for="lastName">Last Name</label>
<input class="w-full bg-transparent border border-outline-gray rounded-[100px] px-lg py-md text-body font-body focus:outline-none focus:border-graphite-inset focus:ring-1 focus:ring-graphite-inset transition-colors placeholder:text-muted-ash" id="lastName" placeholder="Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-gap-element">
<label class="text-label font-label text-text-black" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-lg text-secondary text-[20px] pointer-events-none">mail</span>
<input class="w-full bg-transparent border border-outline-gray rounded-[100px] pl-[48px] pr-lg py-md text-body font-body focus:outline-none focus:border-graphite-inset focus:ring-1 focus:ring-graphite-inset transition-colors placeholder:text-muted-ash" id="email" placeholder="jane@company.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-gap-element">
<label class="text-label font-label text-text-black" for="phone">Phone Number (Optional)</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-lg text-secondary text-[20px] pointer-events-none">call</span>
<input class="w-full bg-transparent border border-outline-gray rounded-[100px] pl-[48px] pr-lg py-md text-body font-body focus:outline-none focus:border-graphite-inset focus:ring-1 focus:ring-graphite-inset transition-colors placeholder:text-muted-ash" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-gap-element">
<label class="text-label font-label text-text-black" for="notes">Additional Notes</label>
<textarea class="w-full bg-transparent border border-outline-gray rounded-xl px-lg py-md text-body font-body focus:outline-none focus:border-graphite-inset focus:ring-1 focus:ring-graphite-inset transition-colors resize-none placeholder:text-muted-ash" id="notes" placeholder="Any specific requirements..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Navigation Buttons -->
<div class="flex justify-end gap-md mt-lg pt-xl border-t border-outline-gray/30">
<button class="bg-mint-accent text-text-black text-label font-label rounded-[200px] px-xl py-md hover:opacity-90 transition-opacity flex items-center gap-sm">
                    Next Step
                    <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
